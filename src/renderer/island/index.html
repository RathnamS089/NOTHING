<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>Island</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="island.css">
</head>
<body>
  <div id="stage">
    <div id="pill" class="hidden" role="status" aria-live="polite">
      <div class="compact">
        <canvas class="mini-glyph" id="cMedia" width="34" height="14" aria-hidden="true"></canvas>
        <span class="anc-glyph" id="cGlyph"></span>
        <span class="c-spacer"></span>
        <span class="c-batt"><span id="cDots"></span><b class="dot-type" id="cLevel">—</b></span>
      </div>
      <div class="expanded">
        <div class="row media" id="eMedia">
          <canvas id="eGlyph" width="72" height="40" aria-hidden="true"></canvas>
          <div class="mtxt"><span class="label" id="eSrc"></span><span class="mtitle" id="eTitle"></span><span class="martist" id="eArtist"></span></div>
        </div>
        <div class="row head">
          <div class="buds" id="eBuds"></div>
          <div class="title">
            <span class="label" id="eStatus">Connected</span>
            <span class="dot-type name" id="eName">—</span>
          </div>
          <button class="anc-chip" id="eAnc" title="Switch noise control"></button>
        </div>
        <div class="row batt" id="eBatt"></div>
        <div class="row foot">
          <span class="label" id="eHint"></span>
          <button class="customise" id="eOpen">Customise <span aria-hidden="true">→</span></button>
        </div>
      </div>
      <div class="trackview">
        <canvas id="tGlyph" width="128" height="48" aria-hidden="true"></canvas>
        <div class="mtxt"><span class="label" id="tSrc"></span><span class="mtitle dot-type" id="tTitle"></span><span class="martist" id="tArtist"></span></div>
      </div>
      <div class="goodbye">
        <span class="label">Disconnected</span>
        <span class="dot-type" id="gName"></span>
      </div>
    </div>
  </div>
  <script src="../shared/ui.js"></script>
  <script src="../shared/glyph.js"></script>
  <script src="island.js"></script>
</body>
</html>
