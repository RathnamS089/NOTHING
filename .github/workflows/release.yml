# Builds Nothing Island for macOS, Windows and Linux.
#
#  - Every pull request (and the manual "Run workflow" button): test + build,
#    with the installers kept as workflow artifacts for 14 days (nothing is
#    published). Branch pushes alone don't build: macOS minutes count 10x on
#    private repos, so builds wait until there's a PR.
#  - Pushing a tag like v0.1.0-alpha.1: the same builds, then a DRAFT
#    pre-release with all installers attached. Review it on GitHub and press
#    Publish yourself; nothing goes out automatically.
#
# macOS builds are ad-hoc signed and Windows builds unsigned (no Apple/Windows
# certificates yet), so testers see Gatekeeper / SmartScreen warnings.
# See RELEASING.md.
name: Build & release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            args: --mac --arm64 --x64
          - os: windows-latest
            name: windows
            args: --win --x64
          - os: ubuntu-latest
            name: linux
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      # macOS builds are ad-hoc signed (package.json build.mac.identity "-").
      # electron-builder skips signing on PRs by default, which would ship an
      # app whose fuse-patched Electron Framework has a broken signature;
      # ad-hoc signing uses no secrets, so it's safe to keep on for PRs.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # On macOS, postinstall compiles the universal Swift Bluetooth helper
      # and fails the job if it can't (CI=true).
      - run: npm ci

      - name: Install rpm tooling (for the Fedora package)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Package
        shell: bash
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Verify macOS signatures
        if: matrix.name == 'mac'
        run: |
          for app in dist/mac*/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --verify --strict "$app/Contents/Resources/native/bin/nothing-link"
          done

      # Launch the packaged app and fail if a page can't load (e.g. a fuse
      # that blocks reading pages from app.asar leaves the windows blank).
      - name: Smoke test packaged app
        if: matrix.name == 'mac'
        run: |
          app="$(ls -d dist/mac-arm64/*.app)"
          exe="$app/Contents/MacOS/Nothing Island"
          ELECTRON_ENABLE_LOGGING=1 "$exe" > smoke.log 2>&1 &
          sleep 8
          "$exe" > /dev/null 2>&1 || true   # second launch opens the app window
          sleep 6
          pkill -f "$exe" || true
          cat smoke.log
          if grep -q "Failed to load URL" smoke.log; then echo "::error::packaged app failed to load a page"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: nothing-island-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --draft --prerelease \
            --title "Nothing Island $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
