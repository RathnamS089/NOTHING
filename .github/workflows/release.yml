# Builds Nothing Island for macOS, Windows and Linux.
#
#  - Every pull request (and the manual "Run workflow" button): test + build,
#    with the installers kept as workflow artifacts for 14 days (nothing is
#    published). Branch pushes alone don't build: macOS minutes count 10x on
#    private repos, so builds wait until there's a PR.
#  - Pushing a tag like v0.1.0-alpha.1: the same builds, then a DRAFT
#    pre-release with all installers attached. Review it on GitHub and press
#    Publish yourself; nothing goes out automatically.
#
# Builds are unsigned for now (no Apple/Windows certificates), so testers see
# Gatekeeper / SmartScreen warnings. See RELEASING.md.
name: Build & release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            args: --mac --arm64 --x64
          - os: windows-latest
            name: windows
            args: --win --x64
          - os: ubuntu-latest
            name: linux
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds: stop electron-builder hunting for certificates.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # On macOS, postinstall compiles the universal Swift Bluetooth helper
      # and fails the job if it can't (CI=true).
      - run: npm ci

      - name: Package
        shell: bash
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: nothing-island-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --draft --prerelease \
            --title "Nothing Island $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
